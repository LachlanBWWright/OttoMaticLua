name: Android Build

on:
  push:
    branches: [ main, copilot/convert-sdl3-game-android ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Clone SDL3
      run: |
        if [ ! -d "extern/SDL" ]; then
          git clone --depth 1 https://github.com/libsdl-org/SDL.git extern/SDL
        fi
    
    - name: Copy SDL Java files
      run: |
        mkdir -p android/app/src/main/java/org/libsdl/app
        cp extern/SDL/android-project/app/src/main/java/org/libsdl/app/*.java android/app/src/main/java/org/libsdl/app/
    
    - name: Copy launcher icons
      run: |
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        cp extern/SDL/android-project/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/
        cp extern/SDL/android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/
        cp extern/SDL/android-project/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/
        cp extern/SDL/android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/
        cp extern/SDL/android-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "ndk.dir=$ANDROID_NDK" >> android/local.properties
    
    - name: Build with Gradle
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: otto-matic-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
