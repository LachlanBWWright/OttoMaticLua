name: Make Release Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-linux-appimage:
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:  # Use oldest available Ubuntu for maximum glibc compatibility
          - { name: x86_64, os: ubuntu-22.04 }
          - { name: aarch64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive'}
      - name: Get build dependencies from APT
        # cf. https://github.com/libsdl-org/SDL/blob/main/docs/README-linux.md
        # + desktop-file-utils for appimagetool
        run: |
          sudo apt update
          sudo apt install -y libasound2-dev libpulse-dev \
            libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
            desktop-file-utils
      - run: echo "ARTIFACT_NAME=$(python3 build.py --print-artifact-name)" >> $GITHUB_ENV
      - run: python3 build.py --dependencies
      - run: python3 build.py --configure
      - run: python3 build.py --build
      - run: python3 build.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: dist/
          compression-level: 0

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive'}
      - run: |
          $ARTIFACT_NAME = python3 build.py --print-artifact-name
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $env:GITHUB_ENV
      - run: python3 build.py --dependencies
      - run: python3 build.py --configure -G 'Visual Studio 17 2022'
      - run: python3 build.py --build
      - run: python3 build.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: dist/
          compression-level: 0

  build-macos:
    runs-on: macos-latest  # as of January 2025, this still supports the macOS 10.13 deployment target
    timeout-minutes: 15
    env:
      CODE_SIGN_IDENTITY: ${{ secrets.APPLE_CODE_SIGN_IDENTITY }}
    steps:
      - uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
      - uses: actions/checkout@v4
        with: {submodules: 'recursive'}
      - name: Get artifact name
        run: echo "ARTIFACT_NAME=$(python3 build.py --print-artifact-name)" >> $GITHUB_ENV
      - run: python3 build.py --dependencies
      - run: python3 build.py --configure
      - run: python3 build.py --build
      - run: python3 build.py --package
      - name: Notarize
        run: |
          xcrun notarytool store-credentials GameNotarizationProfile --apple-id ${{ secrets.APPLE_NOTARIZATION_USERNAME }} --password ${{ secrets.APPLE_NOTARIZATION_PASSWORD }} --team-id ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          xcrun notarytool submit "dist/$ARTIFACT_NAME" --keychain-profile GameNotarizationProfile --wait
      - name: Staple
        run: xcrun stapler staple "dist/$ARTIFACT_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: dist/
          compression-level: 0

  build-wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive'}
      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: .emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: emsdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Emscripten (emsdk)
        # git clone avoids 'emsdk update' which downloads from GitHub and fails
        # with "Remote end closed connection" (mymindstorm/setup-emsdk JS bug:
        # update:"false" is truthy, so emsdk update always runs on cache miss).
        run: |
          if [ ! -f .emsdk/emsdk ]; then
            git clone --depth=1 https://github.com/emscripten-core/emsdk.git .emsdk
            .emsdk/emsdk install latest
          fi
          .emsdk/emsdk activate latest
          source .emsdk/emsdk_env.sh
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$EM_CONFIG" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          for d in "$EMSDK/node/"*/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done
      - name: Cache SDL3 source (WASM build)
        uses: actions/cache@v4
        with:
          path: extern/SDL3-3.2.4
          key: sdl3-wasm-3.2.4-${{ runner.arch }}
      - name: Get artifact name
        run: echo "ARTIFACT_NAME=$(python3 build.py --wasm --print-artifact-name)" >> $GITHUB_ENV
      - run: python3 build.py --wasm --dependencies
      - run: python3 build.py --wasm --configure
      - run: python3 build.py --wasm --build
      - run: python3 build.py --wasm --package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: dist/
          compression-level: 0

  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive'}
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android NDK
        # Android SDK is pre-installed on ubuntu-22.04 at $ANDROID_SDK_ROOT; just install the NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Download SDL3 source
        run: |
          SDL_VER=$(python3 -c "import re; m=re.search(r'sdl_ver\s*=\s*\"([^\"]+)\"', open('build.py').read()); print(m.group(1))")
          mkdir -p extern/SDL3-src
          curl -fsSL "https://libsdl.org/release/SDL3-${SDL_VER}.tar.gz" | tar -xz --strip-components=1 -C extern/SDL3-src
      - name: Build Android APK via SDL3 Android project template
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          SDL_VER=$(python3 -c "import re; m=re.search(r'sdl_ver\s*=\s*\"([^\"]+)\"', open('build.py').read()); print(m.group(1))")
          GAME_VER=$(python3 -c "import re; m=re.search(r'#define\s+GAME_VERSION\s+\"([^\"]+)\"', open('src/Headers/version.h').read()); print(m.group(1))")

          # Use SDL3's bundled Android project as the build scaffold
          cp -r extern/SDL3-src/android-project android-build

          # Point app/jni/SDL at the SDL3 source tree (built as subdirectory by jni/CMakeLists.txt)
          ln -s "$(pwd)/extern/SDL3-src" android-build/app/jni/SDL

          # Copy game source into app/jni/src/ so that GAME_SRCDIR = app/jni/src (CMAKE_SOURCE_DIR = app/jni/)
          rsync -a src/ android-build/app/jni/src/

          # Copy Pomme submodule into app/jni/extern/Pomme/ (CMakeLists.txt does add_subdirectory(extern/Pomme))
          rsync -a extern/Pomme/ android-build/app/jni/extern/Pomme/

          # Place the game CMakeLists.txt as app/jni/src/CMakeLists.txt (SDL template calls add_subdirectory(src))
          cp CMakeLists.txt android-build/app/jni/src/CMakeLists.txt

          # Copy game data as Android assets
          mkdir -p android-build/app/src/main/assets
          cp -r Data android-build/app/src/main/assets/

          cd android-build
          chmod +x gradlew
          ./gradlew assembleDebug -PBUILD_WITH_CMAKE=true

          mkdir -p ../dist
          find . -name "*.apk" -exec cp {} "../dist/OttoMatic-${GAME_VER}-android.apk" \;
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OttoMatic-android
          path: dist/*.apk
          compression-level: 0

  publish-release:
    needs: [build-wasm, build-android]
    runs-on: ubuntu-22.04
    # Only publish releases on push to main (not on manual workflow_dispatch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          pattern: "*-wasm*"
          path: release-artifacts
          merge-multiple: true
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: OttoMatic-android
          path: release-artifacts
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GAME_VER=$(python3 -c "import re; m=re.search(r'#define\s+GAME_VERSION\s+\"([^\"]+)\"', open('src/Headers/version.h').read()); print(m.group(1))")
          TAG="v${GAME_VER}-wasm-android"
          echo "Automated WebAssembly and Android release." > release-notes.md
          echo "" >> release-notes.md
          echo "Serve wasm zip from a web server to play in the browser." >> release-notes.md
          echo "Install the APK on Android (enable Unknown Sources in settings)." >> release-notes.md
          echo "" >> release-notes.md
          echo "Level editor: use --level N to load a level directly, --terrain PATH to override terrain." >> release-notes.md
          echo "" >> release-notes.md
          echo "WASM JS API: OttoMatic_SetFenceCollisions(0/1) toggles fence collisions." >> release-notes.md
          echo "             OttoMatic_SetTerrainPath(path) overrides the terrain file." >> release-notes.md
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin --delete "refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "Otto Matic ${GAME_VER} - WebAssembly & Android" \
            --notes-file release-notes.md \
            release-artifacts/*.zip release-artifacts/*.apk
